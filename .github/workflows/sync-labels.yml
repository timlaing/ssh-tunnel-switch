name: Synchronize labels
on:
  push:
    branches: [main]
    paths: [.github/labels.json, .github/workflows/sync-labels.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const label of labels) {
              try {
                await github.rest.issues.updateLabel({...context.repo, name: label.name, new_name: label.name, color: label.color, description: label.description});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({...context.repo, ...label});
              }
            }
