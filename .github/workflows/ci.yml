name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-14
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Use Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install test and packaging dependencies
        run: python -m pip install -e '.[test]' build twine
      - name: Test standalone service and proxy
        run: python -m pytest -q
      - name: Build Python distribution
        run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify-package.py
      - name: Verify installed wheel and CLI
        run: |
          python -m venv /tmp/package-check
          /tmp/package-check/bin/python -m pip install dist/*.whl
          /tmp/package-check/bin/tunnel-switch --help
          /tmp/package-check/bin/tunnel-switch validate --config examples/config.yaml

  deployment:
    name: Deployment unit syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify systemd unit without starting a service
        run: |
          # The CLI is installed at deployment time; this executable placeholder
          # lets verify check the unit's syntax and dependencies without running it.
          sudo mkdir -p /opt/tunnel-switch/.venv/bin
          sudo ln -s /usr/bin/true /opt/tunnel-switch/.venv/bin/tunnel-switch
          systemd-analyze verify --man=no deploy/systemd/tunnel-switch.service

  ssh:
    name: Real SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Test real OpenSSH startup, rotation, failures and cleanup
        run: python -m pytest -q -m ssh_integration
        env:
          TUNNEL_SWITCH_TEST_SSH: '1'

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff>=0.14,<1'
      - run: ruff check .
