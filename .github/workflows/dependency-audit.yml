name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - requirements-ci.txt
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - pyproject.toml
      - requirements-ci.txt
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: Validate declared dependencies against the installed lockfile
        run: |
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - run: python -m pip_audit --skip-editable --progress-spinner off

