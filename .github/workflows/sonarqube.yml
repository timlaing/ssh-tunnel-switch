name: SonarQube
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  sonarqube:
    name: SonarQube quality gate
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate metadata and select analysis mode
        id: metadata
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          sha = os.environ['HEAD_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise ValueError('Invalid CI revision')
          args = [f'-Dsonar.scm.revision={sha}']
          if os.environ['RUN_EVENT'] == 'pull_request':
              pulls = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/commits/{sha}/pulls"], text=True))
              matches = [p for p in pulls if p['state'] == 'open' and p['head']['sha'] == sha and p['base']['repo']['full_name'] == os.environ['GH_REPO']]
              if len(matches) != 1:
                  raise ValueError('Cannot uniquely match current PR to tested commit')
              pr = matches[0]
              for value in (pr['head']['ref'], pr['base']['ref']):
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9/_.-]*', value):
                      raise ValueError('Unsupported PR branch name')
              args += [f"-Dsonar.pullrequest.key={pr['number']}", f"-Dsonar.pullrequest.branch={pr['head']['ref']}", f"-Dsonar.pullrequest.base={pr['base']['ref']}"]
          else:
              args += ['-Dsonar.branch.name=main']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('args=' + ' '.join(args) + '\n')
          PYCODE
      - name: Download Python coverage from the successful CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-coverage
          path: .sonar-coverage/python
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate coverage without executing repository code
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          ET.parse('.sonar-coverage/python/coverage.xml')
          PYCODE
      - name: Remove pull-request-controlled scanner configuration
        run: rm -f sonar-project.properties
      - name: Require SonarQube credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Scan and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=timlaing_ssh-tunnel-switch
            -Dsonar.organization=timlaing
            -Dsonar.projectName=ssh-tunnel-switch
            -Dsonar.sources=src/tunnel_switch,scripts,.github
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12,3.13,3.14
            -Dsonar.python.coverage.reportPaths=.sonar-coverage/python/coverage.xml
            -Dsonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**
            -Dsonar.qualitygate.wait=true
            ${{ steps.metadata.outputs.args }}
