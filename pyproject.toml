[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-tunnel-switch"
version = "0.1.1"
description = "SSH SOCKS5 tunnel rotation service with an HTTP proxy and REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "typer>=0.15,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "ruamel.yaml>=0.18,<0.20", "httpx>=0.28,<1", "h11>=0.16,<1"]

[project.urls]
Homepage = "https://github.com/timlaing/ssh-tunnel-switch"
Repository = "https://github.com/timlaing/ssh-tunnel-switch"
Issues = "https://github.com/timlaing/ssh-tunnel-switch/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
tunnel-switch = "tunnel_switch.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["ssh_integration: opt-in disposable Docker OpenSSH integration"]

[tool.hatch.build.targets.wheel]
packages = ["src/tunnel_switch"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/examples", "/deploy", "/docs", "/README.md", "/LICENSE", "/SECURITY.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
